<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Animais Marinhos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container-fluid" style="background-color: #a5e8f5;">

  <!--barra de navegação-->
    <nav class="navbar navbar-expand-lg" style="background-color: #a5e8f5;">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Cadastro de Animais</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">🐬 Mamíferos Marinhos </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">🐟 Peixes</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">🐙 Moluscos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">🦐 Crustáceos</a>
              </li>
            </ul>
            <span class="navbar-text">
            </span>
          </div>
        </div>
      </nav>

      <!--Placeholder para a pesquisa do animal-->
      <main>
        <div class="m-5">
          <input type="text" id="form" placeholder="Pesquise" class="container">
        </div>
        <div class="text-center m-5">
          <button type="button" class="btn btn-outline-dark" onclick="Pesquisa()">Pesquisar</button>
                </div>
      </main>

      <!--card com as informações dos animais-->
  
        <div class="card mb-3 container" id="card" >
          <img id="imagem" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title" id="nome">Nome</h5>
            <h6 class="card-title" id="tipo">tipo</h6>
            <p class="card-text" id="descricao">Descriçao</p>
          </div>
     

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="index.js"></script>
</body>

</html>
